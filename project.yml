name: kmusic
options:
  bundleIdPrefix: com.kmusic
  deploymentTarget:
    iOS: "17.0"
settings:
  PRODUCT_NAME: kmusic
  CURRENT_PROJECT_VERSION: 1
  MARKETING_VERSION: 1.0
  INFOPLIST_FILE: kmusic/Info.plist
  GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  kmusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: kmusic
        excludes:
          - "Info.plist"
    info:
      path: kmusic/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kmusic.player
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
